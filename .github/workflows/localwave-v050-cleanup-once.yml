name: Clean temporary LocalWave v0.5.0 publisher

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/localwave-v050-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-shot release scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/localwave-v050-publish-now.yml
          rm -f .github/workflows/localwave-v050-cleanup-once.yml
          git config user.name 'LocalWave Release Bot'
          git config user.email '75506096+livenewme@users.noreply.github.com'
          git add -A
          git commit -m 'chore(localwave): remove temporary v0.5.0 publisher [skip ci]'
          git push
